<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>拍攝實景｜VINAGE</title><style>*{box-sizing:border-box}body{margin:0;background:#161413;color:#f9f5ef;font-family:system-ui,"Microsoft JhengHei",sans-serif}header{max-width:1100px;margin:auto;padding:22px;display:flex;justify-content:space-between;gap:20px;align-items:center}a{color:inherit}main{max-width:1100px;margin:auto;padding:10px 22px 48px}h1{font-size:clamp(1.4rem,4vw,2rem);margin:10px 0 5px}p,footer{color:#c5b8a9;line-height:1.7}img{display:block;max-width:100%;max-height:78vh;margin:auto;object-fit:contain}footer{font-size:.8rem;margin-top:14px}</style></head><body><header><span>VINAGE ／ 實拍參考</span><a href="index.html#location">返回拍攝腳本</a></header><main><h1 id="title">拍攝實景</h1><p>最新提供的實際照片，場地與物品未經重畫。</p><img id="photo" alt="實拍照片"><footer>拍攝位置與商品擺放以現場確認為準。</footer></main><script>const scenes={"living-sofa":"客廳沙發","living-wide":"客廳另一側","living-to-kitchen":"客廳與中島動線","kitchen-island":"中島與冰箱","kitchen-stove":"爐台與料理區","fridge":"冷藏室內部","freezer":"冷凍室內部","gift-set":"大禮盒與六個單品盒","gift-open":"開盒與提袋","gift-three":"禮盒內部"};const params=new URLSearchParams(location.search);const aliases={living:'living-sofa',island:'kitchen-island','island-detail':'kitchen-island',stove:'kitchen-stove'};const requested=params.get('scene');const resolved=aliases[requested]||requested;const key=Object.hasOwn(scenes,resolved)?resolved:'living-sofa';document.getElementById('title').textContent=scenes[key];const img=document.getElementById('photo');img.src='assets/location-latest/'+key+'.jpg';img.alt=scenes[key]+'實拍照片';</script></body></html>
